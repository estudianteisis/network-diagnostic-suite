[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "network-diagnostic-suite"
version = "0.3.1"
description = "Evidence-first Windows network monitor for short disconnects and game reconnects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Network Diagnostic Suite contributors" }]
dependencies = [
  "psutil>=5.9.8",
  "rich>=13.7.1",
  "dnspython>=2.6.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
netdiag = "netdiag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netdiag"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

